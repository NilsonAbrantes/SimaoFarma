{% load static %}
{% load l10n %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Comercial Simão • Realizar Venda</title>

  <!-- jQuery + Select2 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <!-- Biblioteca para leitura de QR Code e Código de Barras via Câmera -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'vendas/css/theme.css' %}">
</head>

<body class="app-theme sale-page">
  <main class="center-stage">
    <section class="surface-card sale-card">

      <div class="page-header">
        <div class="brand-kicker">
          <i class="fa-solid fa-cart-shopping"></i> Venda
        </div>
        <h1>Realizar Venda</h1>
        <p>Selecione produtos e gerencie o carrinho de forma rápida.</p>
      </div>

      <form id="form-adicionar-produto" class="stacked-form">
        {% csrf_token %}

        <!-- Botão para abrir o leitor -->
        <button type="button" class="btn btn-primary" id="btn-escanear" onclick="iniciarScanner()">
            📱 Ler com a Câmera
        </button>

        <!-- Container onde a câmera do celular vai aparecer -->
        <div id="reader" style="width: 100%; max-width: 400px; display: none; margin-top: 15px;"></div>

        <button type="button" class="btn btn-ghost" id="btn-parar-scan" style="display:none; margin-top: 8px;" onclick="pararScanner()">
            Parar Câmera
        </button>

        <!-- Campo do código de barras -->
        <div class="field-group">
            <label for="codigo_barras">Código de Barras:</label>
            <input type="text" id="codigo_barras" name="codigo_barras" class="form-control" placeholder="Escaneie ou digite...">
        </div>

        <!-- SELECT COM BUSCA -->
        <div class="field-group">
          <label for="produto_select">Selecionar Produto</label>
          <select id="produto_select" style="width: 100%">
            <option value="">Buscar produto...</option>
            {% for produto in produtos %}
              <option
                value="{{ produto.id }}"
                data-preco="{{ produto.preco|unlocalize }}"
                data-codigo="{{ produto.codigo_barras|default_if_none:'' }}"
              >
                {{ produto.nome }} {% if produto.codigo_barras %}({{ produto.codigo_barras }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="field-group">
          <label for="cliente_id">Cliente da caderneta</label>
          <select id="cliente_id" name="cliente_id" style="width: 100%">
            <option value="">Venda sem caderneta</option>
            {% for cliente in clientes %}
              <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
            {% endfor %}
          </select>
          <small class="field-help">
            Ao selecionar um cliente, a venda será lançada como dívida na caderneta.
          </small>
        </div>

        <div class="field-group small-field">
          <label for="id_quantidade">Quantidade</label>
          <input type="number" id="id_quantidade" value="1" min="1" inputmode="numeric">
        </div>

        <div class="button-row nav-buttons">
          <button type="submit">
            <i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho
          </button>
        </div>
      </form>

      <div class="sale-section">
        <h3 class="section-title">Itens no Carrinho</h3>
        <div id="carrinho" class="cart-box"></div>
      </div>

      <div class="sale-total">
        <span>Total</span>
        <strong>R$ <span id="valor-total">0,00</span></strong>
      </div>

      <div class="button-row nav-buttons sale-actions">
        <a href="{% url 'home' %}" class="back-button btn-ghost">
          <i class="fa-solid fa-house"></i> Voltar
        </a>

        <button id="finalizar-venda" type="button" class="btn-secondary">
          <i class="fa-solid fa-receipt"></i> Finalizar Venda
        </button>
      </div>

    </section>
  </main>

  <script>
  let carrinho = [];

  $('#produto_select').select2({
    placeholder: "Digite para buscar produto...",
    allowClear: true
  });

  $('#cliente_id').select2({
    placeholder: "Selecione um cliente da caderneta...",
    allowClear: true
  });

  $('#form-adicionar-produto').submit(function (event) {
    event.preventDefault();

    let select = $('#produto_select');
    let produtoId = select.val();
    let produtoNome = select.find(':selected').text();
    let produtoPreco = parseFloat(select.find(':selected').data('preco'));
    let quantidade = parseInt($('#id_quantidade').val());

    if (!produtoId) {
      alert('Selecione um produto.');
      return;
    }

    adicionarAoCarrinho(produtoId, produtoNome, produtoPreco, quantidade);

    $('#produto_select').val(null).trigger('change');
    $('#codigo_barras').val('');
    $('#id_quantidade').val(1);
  });

  function adicionarAoCarrinho(produtoId, produtoNome, produtoPreco, quantidade) {
    let existente = carrinho.find(item => item.produtoId == produtoId);

    if (existente) {
      existente.quantidade += quantidade;
    } else {
      carrinho.push({
        produtoId,
        produtoNome,
        preco: produtoPreco,
        quantidade
      });
    }

    renderizarCarrinho();
  }

  function renderizarCarrinho() {
    $('#carrinho').html('');
    let total = 0;

    if (carrinho.length === 0) {
      $('#carrinho').append('<p class="cart-empty">Carrinho vazio</p>');
    } else {
      carrinho.forEach((item, index) => {
        total += item.preco * item.quantidade;

        $('#carrinho').append(`
          <div class="item-carrinho">
            <div class="item-carrinho-info">
              <p><strong>${item.produtoNome}</strong></p>
              <span>R$ ${item.preco.toFixed(2)}</span>
            </div>

            <div class="item-controls">
              <input type="number" min="1" value="${item.quantidade}"
                class="input-quantidade" data-index="${index}" aria-label="Quantidade de ${item.produtoNome}">

              <button type="button" class="remover" data-index="${index}" aria-label="Remover ${item.produtoNome} do carrinho">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `);
      });
    }

    $('#valor-total').text(total.toFixed(2));

    $('.remover').click(function () {
      let index = $(this).data('index');
      carrinho.splice(index, 1);
      renderizarCarrinho();
    });

    $('.input-quantidade').on('change', function () {
      let index = $(this).data('index');
      let valor = parseInt($(this).val());

      if (!valor || valor < 1) valor = 1;

      carrinho[index].quantidade = valor;
      renderizarCarrinho();
    });
  }

  $('#finalizar-venda').click(function () {
    if (carrinho.length === 0) {
      alert('Carrinho vazio.');
      return;
    }

    $.ajax({
      url: '{% url "realizar_venda" %}',
      type: 'POST',
      data: {
        csrfmiddlewaretoken: '{{ csrf_token }}',
        carrinho: JSON.stringify(carrinho),
        cliente_id: $('#cliente_id').val()
      },
      success: function (response) {
        alert(response.message || 'Venda finalizada!');
        window.location.href = "{% url 'home' %}";
      },
      error: function (xhr) {
        const response = xhr.responseJSON;
        alert(response?.message || 'Erro ao finalizar venda.');
      }
    });
  });

  renderizarCarrinho();

  // ---------- Scanner de código de barras ----------

  let html5QrCodeMethod = null;

  function iniciarScanner() {
      const readerDiv = document.getElementById("reader");
      readerDiv.style.display = "block";
      document.getElementById("btn-parar-scan").style.display = "inline-block";

      html5QrCodeMethod = new Html5Qrcode("reader");

      const config = {
          fps: 10,
          qrbox: { width: 280, height: 120 },
          formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.CODABAR,
              Html5QrcodeSupportedFormats.ITF
          ]
      };

      html5QrCodeMethod.start(
          {
              facingMode: "environment",
              advanced: [{ focusMode: "continuous" }]
          },
          config,
          onScanSuccess,
          onScanFailure
      ).catch(err => {
          console.error("Erro ao iniciar a câmera:", err);
          alert("Não foi possível acessar a câmera. Verifique as permissões e se a página está em HTTPS.");
          readerDiv.style.display = "none";
          document.getElementById("btn-parar-scan").style.display = "none";
      });
  }

  function pararScanner() {
      if (html5QrCodeMethod) {
          html5QrCodeMethod.stop().then(() => {
              document.getElementById("reader").style.display = "none";
              document.getElementById("btn-parar-scan").style.display = "none";
          }).catch(err => console.error("Erro ao parar o leitor:", err));
      }
  }

  function onScanSuccess(decodedText, decodedResult) {
      const inputCodigo = document.getElementById("codigo_barras");
      inputCodigo.value = decodedText;

      pararScanner();
      buscarProdutoNoBanco(decodedText);
  }

  function onScanFailure(error) {
      // Erros de leitura quadro a quadro são normais enquanto o código não estiver
      // enquadrado, por isso ignoramos o log aqui.
  }

  function buscarProdutoNoBanco(codigo) {
      $.ajax({
          url: '{% url "buscar_produto" %}',
          type: 'POST',
          data: {
              csrfmiddlewaretoken: '{{ csrf_token }}',
              pesquisa_produto: codigo
          },
          success: function (resp) {
              if (resp.produto) {
                  const select = $('#produto_select');
                  const produto = resp.produto;

                  // Garante que a option exista no select2 (caso não esteja na lista renderizada)
                  if (!select.find(`option[value="${produto.id}"]`).length) {
                      const opt = new Option(produto.nome, produto.id, true, true);
                      $(opt).attr('data-preco', produto.preco);
                       select.append(opt);
                   }

                  select.val(produto.id).trigger('change');
                  document.getElementById('id_quantidade').focus();
              } else {
                  alert('Produto com código "' + codigo + '" não encontrado.');
              }
          },
          error: function () {
              alert('Erro ao buscar produto.');
          }
      });
  }
  </script>
</body>
</html>
